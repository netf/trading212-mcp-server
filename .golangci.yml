version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nilerr
    - nilnil
    - noctx
    - prealloc
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wrapcheck
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      excludes:
        - G104 # unchecked errors are covered by errcheck
    misspell:
      locale: UK
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: var-naming
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - mcp.ResourceNotFoundError(
      ignore-package-globs:
        - github.com/netf/trading212-mcp-server/*
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - wrapcheck
          - errcheck
          - noctx
          - prealloc

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/netf/trading212-mcp-server
